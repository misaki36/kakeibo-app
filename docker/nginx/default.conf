# Nginxが「どのポートで待ち受けて、リクエストをどう処理するか」を定義する設定ファイル

server {
    # コンテナ内の80番ポートで待ち受ける
    listen 80;

    # アップロードできるファイルの最大サイズを10MBに設定
    # デフォルトは1MBのため、レシート画像のアップロードなどでは不足しがち
    client_max_body_size 10M;

    # 公開するファイルのルートディレクトリ
    # Laravelは public/ ディレクトリだけを外部公開する決まりになっている
    root /var/www/html/public;

    # デフォルトで探しにいくファイル
    index index.php index.html;

    # 通常のリクエスト(画像・CSSなど)の処理
    # ファイルが見つからない場合はindex.phpに渡す(Laravelのルーティングの仕組み)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # .phpファイルへのリクエストをPHP-FPM(appコンテナ)に転送する
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # 隠しファイル(.envなど)へのアクセスを拒否してセキュリティを確保
    location ~ /\.(?!well-known).* {
        deny all;
    }
}